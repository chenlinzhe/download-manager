<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载包管家</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#1f2328;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}header{background:#fff;border-bottom:1px solid #d0d7de;padding:18px 28px;display:flex;justify-content:space-between}h1{font-size:21px;margin:0}main{max-width:1500px;margin:auto;padding:24px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.toolbar,.table-wrap{background:#fff;border:1px solid #d0d7de;border-radius:8px}.card{padding:16px}.card b{display:block;font-size:24px}.muted,#status{color:#636c76}.search-status{color:#0969da;font-weight:600;min-width:0}.notice{background:#fff8c5;border:1px solid #d4a72c;border-radius:6px;padding:10px;margin-bottom:12px}.toolbar{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}input,select,button{font:inherit;border:1px solid #d0d7de;border-radius:6px;padding:7px 10px;background:#fff}input[type=search]{width:320px}.path.open-path{display:block;border:0;padding:0;background:transparent;text-align:left;font-weight:400;cursor:pointer;text-decoration:underline;text-decoration-style:dotted}.destination{width:320px}button{cursor:pointer;font-weight:600;transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease}button:active{transform:scale(.96)}#smartSearch{position:relative;min-width:92px}#smartSearch.searching{padding-left:32px;background:#ddf4ff;color:#0550ae;border-color:#54aeff;box-shadow:0 0 0 3px #54aeff33}#smartSearch.searching::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-7px;border:2px solid #54aeff;border-top-color:#0550ae;border-radius:50%;animation:search-spin .7s linear infinite}@keyframes search-spin{to{transform:rotate(360deg)}}.primary{background:#0969da;color:#fff}.danger,.warn{color:#cf222e}.spacer{flex:1}.table-wrap{overflow:auto;max-height:calc(100vh - 300px)}table{border-collapse:collapse;width:100%;min-width:1250px}th{position:sticky;top:0;background:#f6f8fa;text-align:left;padding:10px}td{border-top:1px solid #d8dee4;padding:10px;vertical-align:top}.name{font-weight:600;max-width:280px;word-break:break-all}.path{font-size:12px;color:#636c76;word-break:break-all}.badge{padding:2px 7px;border-radius:20px;font-weight:600}.keep{background:#dafbe1;color:#1a7f37}.review{background:#fff8c5;color:#9a6700}.drop{background:#ffebe9;color:#cf222e}.why{max-width:260px;color:#636c76}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:#fff;border-radius:10px;padding:22px;width:min(560px,92vw);box-shadow:0 12px 40px #0004}.dialog h2{margin-top:0}.field{display:grid;gap:5px;margin:12px 0}.field input{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.llm{min-width:300px;max-width:390px}.ai{padding:7px;background:#ddf4ff;border-radius:6px;color:#0550ae}.new{color:#0969da;font-weight:700}.empty{text-align:center;padding:60px;color:#636c76}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}main{padding:12px}}
.version{color:#0969da;font-weight:700;margin-right:6px}td.llm{cursor:text}.mynote{background:#fff8c5;border-radius:4px;padding:2px 6px;margin-top:4px;color:#7d4e00;font-size:12px}.note-hint{font-size:11px;color:#8b949e;margin-top:4px}.note-edit{width:100%;font:inherit;border:1px solid #d0d7de;border-radius:6px;padding:5px;resize:vertical}.note-actions{display:flex;gap:6px;margin-top:4px}.mini{padding:3px 8px;font-size:12px;font-weight:400}.scan-bar{text-align:center;color:#636c76;margin-bottom:12px;min-height:20px}.sortable{cursor:pointer;user-select:none;white-space:nowrap}.sortable:hover{color:#0969da}.sortable.asc::after{content:" ▲"}.sortable.desc::after{content:" ▼"}.chk{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:#24292f;user-select:none}</style></head><body><header><h1>📦 智能搜索版</h1><div><span id="ver" class="version" title="当前版本">V1.1</span> <button id="settingsBtn">模型设置</button> <span id="status">准备加载…</span></div></header><main><div class="notice">一周自动扫描一次，可随时点“重新扫描”手动刷新。点“标为保留”＝该包永久留用，不受清理建议影响。AI 相关说明请到“模型设置”查看；程序不会运行任何安装包。</div><section class="summary"><div class="card"><b id="count">—</b>项目</div><div class="card"><b id="size">—</b>总占用</div><div class="card"><b id="drop">—</b>建议不用保住</div><div class="card"><b id="risky">—</b>疑似激活/破解风险</div></section><div class="toolbar"><input id="q" type="search" placeholder="关键词搜索，或输入自然语言后按 Enter"><button id="smartSearch">智能搜索</button><span id="searchStatus" class="search-status" aria-live="polite"></span><select id="filter"><option value="">全部建议</option><option>保留（手工）</option><option>建议保留</option><option>待确认</option><option>不用保住</option></select><label class="chk"><input type="checkbox" id="onlyNew">只看新增</label><select id="root"><option value="__add__">＋ 新增目录…</option><option value="" selected>全部目录</option></select><button id="rescan">重新扫描</button><span class="spacer"></span><span id="selected">已选 0 项</span><input id="dest" class="destination" placeholder="转移目标，如 F:\下载包归档"><button id="keep" disab
