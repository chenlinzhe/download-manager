<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载包管家</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#1f2328;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}header{background:#fff;border-bottom:1px solid #d0d7de;padding:18px 28px;display:flex;justify-content:space-between}h1{font-size:21px;margin:0}main{max-width:1500px;margin:auto;padding:24px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.toolbar,.table-wrap{background:#fff;border:1px solid #d0d7de;border-radius:8px}.card{padding:16px}.card b{display:block;font-size:24px}.muted,#status{color:#636c76}.search-status{color:#0969da;font-weight:600;min-width:0}.notice{background:#fff8c5;border:1px solid #d4a72c;border-radius:6px;padding:10px;margin-bottom:12px}.toolbar{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}input,select,button{font:inherit;border:1px solid #d0d7de;border-radius:6px;padding:7px 10px;background:#fff}input[type=search]{width:320px}.path.open-path{display:block;border:0;padding:0;background:transparent;text-align:left;font-weight:400;cursor:pointer;text-decoration:underline;text-decoration-style:dotted}.manual-add{padding:16px;text-align:center;background:#fff;border:1px dashed #8c959f;border-radius:8px;margin-top:12px}.destination{width:320px}button{cursor:pointer;font-weight:600;transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease}button:active{transform:scale(.96)}#smartSearch{position:relative;min-width:92px}#smartSearch.searching{padding-left:32px;background:#ddf4ff;color:#0550ae;border-color:#54aeff;box-shadow:0 0 0 3px #54aeff33}#smartSearch.searching::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-7px;border:2px solid #54aeff;border-top-color:#0550ae;border-radius:50%;animation:search-spin .7s linear infinite}@keyframes search-spin{to{transform:rotate(360deg)}}.primary{background:#0969da;color:#fff}.danger,.warn{color:#cf222e}.spacer{flex:1}.table-wrap{overflow:auto;max-height:calc(100vh - 300px)}table{border-collapse:collapse;width:100%;min-width:1250px}th{position:sticky;top:0;background:#f6f8fa;text-align:left;padding:10px}td{border-top:1px solid #d8dee4;padding:10px;vertical-align:top}.name{font-weight:600;max-width:280px;word-break:break-all}.path{font-size:12px;color:#636c76;word-break:break-all}.badge{padding:2px 7px;border-radius:20px;font-weight:600}.keep{background:#dafbe1;color:#1a7f37}.review{background:#fff8c5;color:#9a6700}.drop{background:#ffebe9;color:#cf222e}.why{max-width:260px;color:#636c76}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:#fff;border-radius:10px;padding:22px;width:min(560px,92vw);box-shadow:0 12px 40px #0004}.dialog h2{margin-top:0}.field{display:grid;gap:5px;margin:12px 0}.field input{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.llm{min-width:300px;max-width:390px}.ai{padding:7px;background:#ddf4ff;border-radius:6px;color:#0550ae}.new{color:#0969da;font-weight:700}.empty{text-align:center;padding:60px;color:#636c76}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}main{padding:12px}}
</style></head><body><header><h1>📦 下载包管家 <small class="muted">智能搜索版 v10</small></h1><div><button id="settingsBtn">软件设置</button> <span id="status">准备扫描…</span></div></header><main><div class="notice">手工标记“保留”后会永久记住，重新扫描不会覆盖。启用 AI 后，首次会以每组 10 个并发询问 DeepSeek，返回简短说明；以后只询问新增且未缓存的包；表格中的蓝色“LLM 说明”是模型结果。基础规则分析只作清理参考；不会运行安装包。“删除”实际移入 Windows 回收站，可恢复。</div><section class="summary"><div class="card"><b id="count">—</b>项目</div><div class="card"><b id="size">—</b>总占用</div><div class="card"><b id="drop">—</b>建议不用保住</div><div class="card"><b id="risky">—</b>疑似激活/破解风险</div></section><div class="toolbar"><input id="q" type="search" placeholder="模糊搜索，或输入自然语言后按 Enter"><button id="smartSearch">智能搜索</button><span id="searchStatus" class="search-status" aria-live="polite"></span><select id="filter"><option value="">全部建议</option><option>保留（手工）</option><option>建议保留</option><option>待确认</option><option>不用保住</option></select><select id="root"><option value="">全部目录</option></select><button id="rescan">重新扫描</button><span class="spacer"></span><span id="selected">已选 0 项</span><input id="dest" class="destination" placeholder="转移目标，如 F:\下载包归档"><button id="keep" disabled>标为保留</button><button id="move" class="primary" disabled>转移所选</button><button id="del" class="danger" disabled>移到回收站</button></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="all"></th><th>包 / 路径</th><th>LLM：这是个什么包</th><th>建议</th><th>价值分</th><th>大小</th><th>时间</th><th>可重下性</th><th>注册 / 授权情况</th><th>判断依据</th></tr></thead><tbody id="body"><tr><td colspan="10" class="empty">正在扫描本机下载目录…</td></tr></tbody></table></div><div class="manual-add"><button id="addRoot" class="primary">＋ 手工添加扫描目录</button><div class="muted">添加后永久参与扫描</div></div></main><div id="settingsModal" class="modal"><div class="dialog"><h2>软件设置</h2><div class="field"><label>DeepSeek API Key</label><input id="apiKey" type="password" placeholder="留空表示不更换"><small id="keyStatus" class="muted"></small></div><div class="field"><label>API 地址</label><input id="baseUrl" value="https://api.deepseek.com"></div><div class="field"><label>模型</label><input id="model" value="deepseek-v4-flash"></div><label><input id="autoSearch" type="checkbox" checked> 自动询问 LLM：首次分析现有未说明包，以后只分析新增包</label><div class="dialog-actions"><button id="settingsCancel">取消</button><button id="settingsSave" class="primary">保存</button></div></div></div><script src="app.js?v=20260727-13"></script></body></html>
